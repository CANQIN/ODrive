
components:
  - type: generalpurpose
    name: homenet
    net: homenet

  - type: generalpurpose
    name: rpi
    ssh: odrv
    net: homenet
    components:
      - type: uart
        name: uart0
        port: /dev/ttyS0
        connected-to: main_uart
      - type: can
        name: can0
        interface: can0
        connected-to: odrive.can

  - type: odrive
    name: odrive
    board-version: v3.6-56V
    serial-number: "206839975453"
    brake-resistance: 2.0
    usb: auto
    can: main_canbus
    vbus-voltage: 20.5 # [V]
    max-brake-power: 150 # [W]
    encoder0: floating
    encoder1: floating
    motor0: D5065-270KV_0
    motor1: floating

  - type: motor
    name: D5065-270KV_0
    phase-resistance: 0.039
    phase-inductance: 1.57e-05
    pole-pairs: 7
    direction: 1
    kv: 270
    max-current: 70
    max-voltage: 40

  - type: encoder
    name: real_encoder
    cpr: 8192
    max-rpm: 7000

connections:
  - ['odrive.can', 'rpi.can0']
  - ['odrive.axis0', 'D5065-270KV_0.phases']
  - ['D5065-270KV_0.shaft', 'real_encoder.shaft']
